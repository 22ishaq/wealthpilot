# docker compose up --build   ->   http://localhost:8080  (demo@northwind.test / wealthpilot-demo)
name: wealthpilot

x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: wealthpilot-api:local
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://wealthpilot_app:wealthpilot_app@postgres:5432/wealthpilot
    MIGRATION_DATABASE_URL: postgresql://wealthpilot:wealthpilot@postgres:5432/wealthpilot
    APP_ORIGIN: http://localhost:8080
    COOKIE_SECURE: "false" # plain http on localhost; leave unset (secure) in production
    TRUST_PROXY: "true"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      POSTGRES_DB: wealthpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthpilot -d wealthpilot"]
      interval: 2s
      retries: 30

  migrate:
    <<: *api
    command: ["node", "dist/migrate.js"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *api
    command: ["node", "dist/seed.js"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
